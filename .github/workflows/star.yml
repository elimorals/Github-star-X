name: star-tom-doerr

on:
  schedule:
    - cron: "0 */6 * * *"   # cada 6 horas
  workflow_dispatch:         # y bajo demanda desde la UI

permissions:
  contents: write            # para commitear state.json

concurrency: star            # nunca dos corridas a la vez (state.json)

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium

      - run: python star.py
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          GH_TOKEN: ${{ secrets.STAR_TOKEN }}
          # Filtros opcionales. Se configuran en Settings -> Secrets and
          # variables -> Actions -> Variables (no son secretos). Si no
          # existen llegan vacios y el filtro queda apagado.
          MAX_AGE_MONTHS: ${{ vars.MAX_AGE_MONTHS }}
          KEYWORDS: ${{ vars.KEYWORDS }}
          MIN_STARS: ${{ vars.MIN_STARS }}

      - name: Guardar checkpoint
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || {
            git commit -m "state: $(date -u +%F\ %H:%M)"
            git push
          }
